name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Servidor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm rebuild bcrypt esbuild
      - run: npm run build
      - run: npm run test:types
      - run: npm run test:coverage

      - name: Upload server coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: server/coverage/lcov.info
          format: lcov
          flag-name: server
          parallel: true
          base-path: server

      - name: Save server coverage for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-coverage
          path: server/coverage/lcov.info
          if-no-files-found: error

  client:
    name: Cliente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

      - name: Upload client coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: client/coverage/lcov.info
          format: lcov
          flag-name: client
          parallel: true
          base-path: client

      - name: Save client coverage for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage
          path: client/coverage/lcov.info
          if-no-files-found: error

  coveralls-finish:
    name: Finalizar reporte de Coveralls
    runs-on: ubuntu-latest
    needs: [server, client]
    if: ${{ always() }}
    steps:
      - name: Mark parallel build as finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download server coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-coverage
          path: server/coverage

      - name: Download client coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-coverage
          path: client/coverage

      - name: Adjust LCOV paths for the repository root
        run: |
          sed -i 's|^SF:|SF:server/|' server/coverage/lcov.info
          sed -i 's|^SF:|SF:client/|' client/coverage/lcov.info

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}